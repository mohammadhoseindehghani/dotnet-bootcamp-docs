<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
<title id="title">Reference-type assignment</title><desc id="desc">first and second contain references to one shared array. Updating second at index 0 changes the shared array.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="270" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><rect x="20" y="30" width="230" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="135.0" y="64" text-anchor="middle" font-size="21" font-weight="700">first</text><text x="135.0" y="94" text-anchor="middle" font-size="17" fill="#505570">reference</text><rect x="20" y="154" width="230" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="135.0" y="188" text-anchor="middle" font-size="21" font-weight="700">second</text><text x="135.0" y="218" text-anchor="middle" font-size="17" fill="#505570">copied reference</text><rect x="470" y="92" width="265" height="100" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="602.5" y="126" text-anchor="middle" font-size="21" font-weight="700">One array object</text><text x="602.5" y="156" text-anchor="middle" font-size="17" fill="#505570">[99, 20]</text><path d="M257,75 L462,126" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M257,199 L462,160" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="227" font-size="17" fill="#505570">second[0] = 99</text></g></svg>