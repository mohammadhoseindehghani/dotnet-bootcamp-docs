<svg xmlns="http://www.w3.org/2000/svg" width="760" height="255" viewBox="0 0 760 255" role="img" aria-labelledby="title desc">
<title id="title">A conceptual view of local storage and the managed heap</title><desc id="desc">The current call has a local message reference to string data. Locals may use stack slots or registers; not all value types live on the stack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="255" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><rect x="20" y="30" width="300" height="120" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="170.0" y="64" text-anchor="middle" font-size="21" font-weight="700">Current call</text><text x="170.0" y="94" text-anchor="middle" font-size="17" fill="#505570">message: reference</text><rect x="435" y="30" width="305" height="120" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="587.5" y="64" text-anchor="middle" font-size="21" font-weight="700">Managed heap</text><text x="587.5" y="94" text-anchor="middle" font-size="17" fill="#505570">string object: &quot;some text&quot;</text><path d="M330,90 L425,90" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="25" y="195" font-size="17" fill="#505570">Call frames use the stack. Actual local storage can vary.</text><text x="25" y="225" font-size="17" fill="#505570">Type category and physical storage are different questions.</text></g></svg>