<svg xmlns="http://www.w3.org/2000/svg" width="760" height="305" viewBox="0 0 760 305" role="img" aria-labelledby="title desc">
<title id="title">Value-type assignment</title><desc id="desc">After y equals x, both have value 10. Changing y to 99 leaves x equal to 10.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="305" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><text x="25" y="30" font-size="17" fill="#505570">After y = x</text><rect x="25" y="47" width="200" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="125.0" y="81" text-anchor="middle" font-size="21" font-weight="700">x</text><text x="125.0" y="111" text-anchor="middle" font-size="17" fill="#505570">10</text><rect x="285" y="47" width="200" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="385.0" y="81" text-anchor="middle" font-size="21" font-weight="700">y</text><text x="385.0" y="111" text-anchor="middle" font-size="17" fill="#505570">10</text><path d="M232,90 L276,90" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="25" y="178" font-size="17" fill="#505570">Then y = 99</text><rect x="25" y="195" width="200" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="125.0" y="229" text-anchor="middle" font-size="21" font-weight="700">x</text><text x="125.0" y="259" text-anchor="middle" font-size="17" fill="#505570">10</text><rect x="285" y="195" width="200" height="88" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="385.0" y="229" text-anchor="middle" font-size="21" font-weight="700">y</text><text x="385.0" y="259" text-anchor="middle" font-size="17" fill="#505570">99</text><text x="525" y="90" font-size="17" fill="#505570">Copy the value</text><text x="525" y="240" font-size="17" fill="#505570">Independent values</text></g></svg>