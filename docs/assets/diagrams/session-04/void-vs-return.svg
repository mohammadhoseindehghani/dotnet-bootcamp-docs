<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">Return value versus action</title><desc id="desc">Sum returns 8 to the caller. SayHello displays Hello but returns no value.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="250" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><rect x="20" y="20" width="230" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="135.0" y="54" text-anchor="middle" font-size="21" font-weight="700">Sum(3, 5)</text><text x="135.0" y="84" text-anchor="middle" font-size="17" fill="#505570">returns int</text><rect x="485" y="20" width="255" height="88" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="612.5" y="54" text-anchor="middle" font-size="21" font-weight="700">Value: 8</text><text x="612.5" y="84" text-anchor="middle" font-size="17" fill="#505570">can be stored or reused</text><path d="M260,64 L475,64" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="20" y="140" width="230" height="88" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="135.0" y="174" text-anchor="middle" font-size="21" font-weight="700">SayHello()</text><text x="135.0" y="204" text-anchor="middle" font-size="17" fill="#505570">returns void</text><rect x="485" y="140" width="255" height="88" rx="14" fill="#fff4df" stroke="#c9c2e5" stroke-width="2"/><text x="612.5" y="174" text-anchor="middle" font-size="21" font-weight="700">Prints: Hello!</text><text x="612.5" y="204" text-anchor="middle" font-size="17" fill="#505570">no returned value</text><path d="M260,184 L475,184" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g></svg>