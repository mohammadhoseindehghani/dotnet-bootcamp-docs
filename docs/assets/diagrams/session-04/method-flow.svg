<svg xmlns="http://www.w3.org/2000/svg" width="760" height="245" viewBox="0 0 760 245" role="img" aria-labelledby="title desc">
<title id="title">A method transforms input into a result</title><desc id="desc">Inputs 3 and 5 enter Sum. Sum calculates 3 plus 5 and returns 8.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="245" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><rect x="20" y="65" width="165" height="94" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="102.5" y="99" text-anchor="middle" font-size="21" font-weight="700">Inputs</text><text x="102.5" y="129" text-anchor="middle" font-size="17" fill="#505570">3 and 5</text><rect x="280" y="65" width="200" height="94" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="380.0" y="99" text-anchor="middle" font-size="21" font-weight="700">Sum(a, b)</text><text x="380.0" y="129" text-anchor="middle" font-size="17" fill="#505570">return a + b;</text><rect x="575" y="65" width="165" height="94" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="657.5" y="99" text-anchor="middle" font-size="21" font-weight="700">Result</text><text x="657.5" y="129" text-anchor="middle" font-size="17" fill="#505570">8</text><path d="M190,112 L274,112" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M485,112 L569,112" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="280" y="205" font-size="17" fill="#505570">Define once. Call with different inputs.</text></g></svg>