<svg xmlns="http://www.w3.org/2000/svg" width="760" height="245" viewBox="0 0 760 245" role="img" aria-labelledby="title desc">
<title id="title">Reading string a equals salam</title><desc id="desc">string is the declared type. Variable a contains a reference to string object S1 whose text is salam.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6750d8"/></marker></defs>
<rect width="760" height="245" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#24283d"><text x="25" y="33" font-size="17" fill="#505570">string a = &quot;salam&quot;;</text><rect x="25" y="65" width="230" height="100" rx="14" fill="#f1edff" stroke="#c9c2e5" stroke-width="2"/><text x="140.0" y="99" text-anchor="middle" font-size="21" font-weight="700">Variable: a</text><text x="140.0" y="129" text-anchor="middle" font-size="17" fill="#505570">type: string</text><rect x="475" y="65" width="260" height="100" rx="14" fill="#e6f7f1" stroke="#c9c2e5" stroke-width="2"/><text x="605.0" y="99" text-anchor="middle" font-size="21" font-weight="700">String object S1</text><text x="605.0" y="129" text-anchor="middle" font-size="17" fill="#505570">text: &quot;salam&quot;</text><path d="M265,115 L465,115" stroke="#6750d8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="298" y="95" font-size="17" fill="#505570">reference</text><text x="25" y="213" font-size="17" fill="#505570">S1 is an illustration label, not a real memory address.</text></g></svg>